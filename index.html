<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexander Friedrich</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="grid">
        <a class="card" href="https://fitness.alexander-friedrich.at" data-card="fitness">
            <span class="card__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7v10"/>
                    <path d="M7 5v14"/>
                    <path d="M17 5v14"/>
                    <path d="M20 7v10"/>
                    <path d="M7 12h10"/>
                </svg>
            </span>
            <h2 class="card__title">Fitness</h2>
        </a>

        <a class="card" href="https://finanzen.alexander-friedrich.at" data-card="finanzen">
            <span class="card__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 17l6-6 4 4 8-8"/>
                    <path d="M14 7h7v7"/>
                </svg>
            </span>
            <h2 class="card__title">Finanzen</h2>
        </a>
    </main>

    <script src="script.js"></script>
</body>
</html>
